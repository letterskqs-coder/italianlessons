<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leliana — L’Italia oltre il Colosseo</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@300;400;500;700&display=swap" rel="stylesheet">

<style>
  body {
    font-family: 'DM Sans', sans-serif;
    background: #f4f7f6;
    margin: 0;
    padding: 0;
  }

  header {
    background: #1f3b57;
    color: white;
    padding: 30px 20px;
    text-align: center;
    border-bottom: 5px solid #c8773a;
  }

  .wrapper {
    max-width: 900px;
    margin: 20px auto;
    padding: 0 20px;
  }

  .tab-nav {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    padding-bottom: 10px;
  }

  .tab-btn {
    flex: 1;
    min-width: 160px;
    padding: 12px;
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    cursor: pointer;
    font-weight: 600;
  }

  .tab-btn.active {
    background: #1f3b57;
    color: white;
  }

  .section {
    display: none;
  }

  .section.active {
    display: block;
  }

  .card {
    background: white;
    padding: 25px;
    border-radius: 16px;
    margin-bottom: 20px;
    border: 1px solid #ddd;
  }

  input[type="text"] {
    border: none;
    border-bottom: 2px solid #1f3b57;
    padding: 4px;
    width: 180px;
  }

  input.correct { border-bottom-color: green; color: green; }
  input.wrong { border-bottom-color: red; color: red; }

  textarea {
    width: 100%;
    height: 120px;
    padding: 10px;
    border-radius: 10px;
    border: 1px solid #ccc;
    margin-top: 10px;
  }

  .btn-check {
    background: #1f3b57;
    color: white;
    padding: 10px 20px;
    border-radius: 8px;
    border: none;
    cursor: pointer;
    margin-top: 10px;
  }

  .feedback-msg {
    display: none;
    margin-top: 10px;
    font-weight: bold;
  }
</style>
</head>

<body>

<header>
  <h1>🇮🇹 Leliana — L’Italia oltre il Colosseo</h1>
  <p>Arte · Storia · Viaggi · Italiano reale</p>
</header>

<div class="wrapper">

  <!-- NAV -->
  <div class="tab-nav">
    <button class="tab-btn active" onclick="showTab('u1', this)">1. Borghi</button><script>
function showTab(id, btn) {
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
}

function validate(id, correct) {
  const el = document.getElementById(id);
  if (!el) return false;
  const ok = el.value.trim().toLowerCase() === correct.toLowerCase();
  el.className = ok ? 'correct' : 'wrong';
  return ok;
}

function checkU1() {
  const r = [
    validate('u1v1','borgo'),
    validate('u1v2','ponte'),
    validate('u1v3','campanile'),
    validate('u1v4','mare')
  ];
  const msg = document.getElementById('msg-u1');
  msg.style.display = 'block';
  msg.innerHTML = r.every(Boolean) ? "Perfetto!" : "Riprova.";
  msg.style.color = r.every(Boolean) ? "green" : "red";
}

</html>
